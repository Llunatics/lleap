[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lleap"
version = "1.0.0"
description = "SSRF and open-redirect tester for your own apps and labs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Llunatics" }]
keywords = ["ssrf", "open-redirect", "security", "pentest", "cli"]
dependencies = []

[project.scripts]
lleap = "lleap.cli:main"

[tool.setuptools.packages.find]
include = ["lleap*"]
